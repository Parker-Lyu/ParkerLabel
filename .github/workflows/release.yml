name: Build draft release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version or tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 builds/prepare_release.py verify-tag --tag "$GITHUB_REF_NAME"
          else
            python3 builds/prepare_release.py verify-version
          fi

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ''
      - name: Build macOS arm64
        shell: bash -el {0}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ./builds/build-macos.sh
          else
            ./builds/build-macos.sh --candidate
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            builds/output/*/macos-arm64/*.zip
            builds/output/*/macos-arm64/build-info.json
            builds/output/*/macos-arm64/license-inventory.json
            builds/output/*/macos-arm64/size-report.json
            builds/output/*/macos-arm64/SHA256SUMS

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ''
      - name: Build Windows x64
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            .\builds\build-windows.ps1
          } else {
            .\builds\build-windows.ps1 -Candidate
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            builds/output/*/windows-x64/*.zip
            builds/output/*/windows-x64/build-info.json
            builds/output/*/windows-x64/license-inventory.json
            builds/output/*/windows-x64/size-report.json
            builds/output/*/windows-x64/SHA256SUMS

  draft_macos:
    needs: macos
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash builds/publish_draft.sh

  draft_windows:
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash builds/publish_draft.sh
